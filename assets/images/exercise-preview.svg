<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="exBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE" />
      <stop offset="50%" stop-color="#DDD6FE" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>
    <linearGradient id="exCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F3FF" />
    </linearGradient>
    <filter id="exShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6D28D9" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="24" fill="url(#exBg)" />
  <circle cx="90" cy="70" r="45" fill="#A78BFA" opacity="0.3" />
  <circle cx="510" cy="290" r="75" fill="#8B5CF6" opacity="0.25" />

  <g filter="url(#exShadow)">
    <rect x="70" y="45" width="460" height="270" rx="20" fill="url(#exCardGrad)" stroke="#DDD6FE" stroke-width="1" />
    
    <rect x="70" y="45" width="460" height="42" rx="20" fill="#EDE9FE" />
    <rect x="70" y="67" width="460" height="20" fill="#EDE9FE" />
    <circle cx="95" cy="66" r="5" fill="#EF4444" />
    <circle cx="110" cy="66" r="5" fill="#F59E0B" />
    <circle cx="125" cy="66" r="5" fill="#10B981" />
    <text x="300" y="70" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#6D28D9">Exercise & Workout • Tracker</text>

    <!-- Workout Progress Bar -->
    <rect x="95" y="102" width="410" height="70" rx="14" fill="#6D28D9" />
    <text x="115" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#DDD6FE">Daily Workout Goal / เป้าหมายวันนี้</text>
    <text x="115" y="154" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">45 / 60 Min • 4 Sets Done</text>
    <circle cx="460" cy="137" r="22" fill="#7C3AED" />
    <text x="460" y="143" text-anchor="middle" font-size="18">🔥</text>

    <!-- Routine Cards -->
    <rect x="95" y="185" width="195" height="110" rx="12" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="2" />
    <text x="115" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#1E293B">🏋️ Strength Training</text>
    <text x="115" y="230" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748B">Chest & Triceps (3 Exercises)</text>
    <rect x="115" y="250" width="155" height="6" rx="3" fill="#E2E8F0" />
    <rect x="115" y="250" width="120" height="6" rx="3" fill="#8B5CF6" />
    <text x="115" y="278" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#059669">✓ 80% Completed</text>

    <rect x="310" y="185" width="195" height="110" rx="12" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="2" />
    <text x="330" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#1E293B">🏃 Cardio & Stretch</text>
    <text x="330" y="230" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748B">Cooldown (15 mins)</text>
    <rect x="330" y="250" width="155" height="6" rx="3" fill="#E2E8F0" />
    <rect x="330" y="250" width="80" height="6" rx="3" fill="#3B82F6" />
    <text x="330" y="278" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#6366F1">⏳ In Progress</text>
  </g>
</svg>
