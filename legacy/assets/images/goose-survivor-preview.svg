<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="40%" stop-color="#18181b" />
      <stop offset="75%" stop-color="#27153a" />
      <stop offset="100%" stop-color="#3f0a1c" />
    </linearGradient>

    <!-- Golden Goose Body Gradient -->
    <linearGradient id="gooseBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Shockwave Ring Gradient -->
    <radialGradient id="honkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#EF4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>

    <!-- Crimson Laser Glow -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" fill="url(#bgGrad)" />

  <!-- Grid Pattern overlay -->
  <g opacity="0.12" stroke="#A855F7" stroke-width="1">
    <line x1="0" y1="50" x2="600" y2="50" />
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="250" x2="600" y2="250" />
    <line x1="100" y1="0" x2="100" y2="300" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
    <line x1="500" y1="0" x2="500" y2="300" />
  </g>

  <!-- Mega Honk Shockwave Rings -->
  <circle cx="270" cy="150" r="120" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.25" stroke-dasharray="8 6" />
  <circle cx="270" cy="150" r="80" fill="none" stroke="#EF4444" stroke-width="3" opacity="0.45" />
  <circle cx="270" cy="150" r="45" fill="url(#honkGlow)" opacity="0.6" />

  <!-- Bullet Hell Projectiles Flying -->
  <!-- Feather Gatling Shards -->
  <g filter="url(#glow)">
    <polygon points="340,140 370,136 345,144" fill="#FEF08A" />
    <polygon points="345,155 380,155 350,160" fill="#FEF08A" />
    <polygon points="335,170 365,178 340,175" fill="#FEF08A" />
    <polygon points="310,195 330,225 315,200" fill="#FDE047" />
    <polygon points="230,105 210,75 225,100" fill="#FDE047" />
  </g>

  <!-- Enemy Bullets (Red Orbs) -->
  <g filter="url(#glow)">
    <circle cx="120" cy="80" r="6" fill="#EF4444" />
    <circle cx="140" cy="110" r="5" fill="#F43F5E" />
    <circle cx="160" cy="60" r="5" fill="#EF4444" />
    <circle cx="430" cy="90" r="6" fill="#DC2626" />
    <circle cx="470" cy="130" r="7" fill="#EF4444" />
    <circle cx="450" cy="220" r="6" fill="#F43F5E" />
    <circle cx="410" cy="240" r="5" fill="#DC2626" />
    <circle cx="150" cy="220" r="6" fill="#EF4444" />
    <circle cx="120" cy="180" r="7" fill="#DC2626" />
  </g>

  <!-- Egg Mines on Ground -->
  <g filter="url(#glow)">
    <ellipse cx="200" cy="220" rx="9" ry="12" fill="#FEF08A" transform="rotate(-15 200 220)" />
    <ellipse cx="360" cy="230" rx="9" ry="12" fill="#FEF08A" transform="rotate(20 360 230)" />
  </g>

  <!-- Bread Drop Item (HP) -->
  <g transform="translate(180, 110)">
    <rect x="0" y="0" width="18" height="14" rx="4" fill="#D97706" stroke="#FEF3C7" stroke-width="1.5" filter="url(#glow)" />
    <circle cx="9" cy="7" r="2" fill="#FEF3C7" />
  </g>

  <!-- Central Hero: Golden Battle Goose 🪿 -->
  <g id="heroGoose" transform="translate(250, 120)">
    <!-- Shadow -->
    <ellipse cx="22" cy="52" rx="28" ry="9" fill="#000000" opacity="0.6" />
    
    <!-- Aura Ring -->
    <ellipse cx="22" cy="28" rx="34" ry="34" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.8" stroke-dasharray="5 3" filter="url(#glow)" />

    <!-- Body -->
    <ellipse cx="20" cy="30" rx="20" ry="14" fill="url(#gooseBody)" />
    <!-- Wing -->
    <path d="M 12 28 C 16 20, 28 20, 24 34 C 18 36, 12 34, 12 28 Z" fill="#FBBF24" />
    <!-- Neck & Head -->
    <path d="M 28 28 C 34 26, 36 12, 34 8 C 32 4, 38 4, 40 8 C 42 16, 36 28, 30 32 Z" fill="url(#gooseBody)" />
    <circle cx="38" cy="8" r="8" fill="url(#gooseBody)" />
    <!-- Eye -->
    <circle cx="41" cy="7" r="2" fill="#0F172A" />
    <circle cx="42" cy="6" r="0.8" fill="#FFFFFF" />
    <!-- Beak -->
    <polygon points="44,6 54,9 44,12" fill="#F97316" />
    <!-- Golden King Crown -->
    <polygon points="32,2 35,-5 38,-1 41,-6 44,-1 47,-5 49,2" fill="#FDE047" stroke="#D97706" stroke-width="0.8" filter="url(#glow)" />
    
    <!-- Weapon Light Beam -->
    <line x1="44" y1="9" x2="70" y2="9" stroke="url(#laserGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  </g>

  <!-- HUD Overlay Graphics -->
  <!-- Top Left: HP & EXP Bar -->
  <g transform="translate(25, 20)">
    <!-- HP Bar -->
    <rect x="0" y="0" width="130" height="12" rx="6" fill="#18181B" stroke="#3F3F46" stroke-width="1" />
    <rect x="1" y="1" width="105" height="10" rx="5" fill="#EF4444" />
    <text x="5" y="9" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="8" font-weight="bold">HP 85/100</text>
    
    <!-- EXP Bar -->
    <rect x="0" y="16" width="130" height="6" rx="3" fill="#18181B" stroke="#3F3F46" stroke-width="0.5" />
    <rect x="1" y="17" width="90" height="4" rx="2" fill="#3B82F6" />
  </g>

  <!-- Top Right: Time & Kills -->
  <g transform="translate(450, 22)">
    <rect x="0" y="0" width="125" height="30" rx="8" fill="rgba(24, 24, 27, 0.85)" stroke="#4C1D95" stroke-width="1.5" />
    <text x="12" y="19" fill="#FBBF24" font-family="'Courier New', monospace" font-size="12" font-weight="bold">⏱ 08:45</text>
    <text x="75" y="19" fill="#EF4444" font-family="'Courier New', monospace" font-size="12" font-weight="bold">💀 412</text>
  </g>

  <!-- Title Watermark -->
  <text x="300" y="278" fill="#FFFFFF" opacity="0.9" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="2">
    GOOSE SURVIVOR: BULLET HELL 🦆💥
  </text>
</svg>
