<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night Sky Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Night Hills Gradients -->
    <linearGradient id="nightHillBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="nightHillFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <!-- Moon Glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FEF08A" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#nightSky)" />

  <!-- Stars -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="150" cy="120" r="1.5" /><circle cx="320" cy="80" r="2" /><circle cx="480" cy="190" r="1.2" />
    <circle cx="700" cy="110" r="2.5" /><circle cx="920" cy="70" r="1.5" /><circle cx="1100" cy="160" r="2" />
    <circle cx="1300" cy="90" r="1.8" /><circle cx="1720" cy="140" r="2.2" /><circle cx="1850" cy="220" r="1.5" />
    <circle cx="260" cy="280" r="1.5" /><circle cx="620" cy="250" r="1.8" /><circle cx="840" cy="220" r="1.2" />
  </g>

  <!-- Crescent Moon -->
  <circle cx="1600" cy="180" r="90" fill="url(#moonGlow)" />
  <path d="M 1600 130 A 50 50 0 1 0 1650 180 A 40 40 0 1 1 1600 130 Z" fill="#FEF08A" />

  <!-- Distant Barn in Night Silhouette -->
  <g transform="translate(1380, 440) scale(0.65)" opacity="0.6">
    <path d="M 40 100 L 100 40 L 160 100 L 160 180 L 40 180 Z" fill="#312E81" />
    <rect x="78" y="115" width="44" height="65" fill="#FEF08A" opacity="0.4" />
  </g>

  <!-- Night Hills -->
  <path d="M 0 560 Q 500 460 1050 540 T 1920 530 L 1920 1080 L 0 1080 Z" fill="url(#nightHillBack)" opacity="0.8" />
  <path d="M 0 700 Q 400 630 950 690 Q 1500 750 1920 670 L 1920 1080 L 0 1080 Z" fill="url(#nightHillFront)" />

  <!-- Dark Pond with Moon Reflection -->
  <ellipse cx="1450" cy="860" rx="340" ry="130" fill="#0C4A6E" opacity="0.9" />
  <ellipse cx="1450" cy="855" rx="120" ry="25" fill="#38BDF8" opacity="0.3" filter="blur(6px)" />

  <!-- Sleeping/Resting Goose (Night) -->
  <g transform="translate(480, 800) scale(0.7)">
    <ellipse cx="60" cy="70" rx="35" ry="22" fill="#E2E8F0" />
    <path d="M 75 66 C 82 50, 75 40, 65 42 C 55 45, 60 65, 75 66 Z" fill="#E2E8F0" /> <!-- Head tucked in -->
    <path d="M 60 44 L 50 48 L 62 52 Z" fill="#F97316" />
    <circle cx="68" cy="46" r="1.5" fill="#334155" />
  </g>

  <!-- Glowing Fireflies -->
  <g fill="#FDE047">
    <circle cx="340" cy="780" r="3" opacity="0.9" filter="blur(1px)" />
    <circle cx="620" cy="740" r="3.5" opacity="0.8" filter="blur(1px)" />
    <circle cx="950" cy="820" r="2.5" opacity="0.9" filter="blur(1px)" />
    <circle cx="1280" cy="790" r="3" opacity="0.85" filter="blur(1px)" />
  </g>
</svg>
