<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD6E0" />
      <stop offset="50%" stop-color="#C1ECE4" />
      <stop offset="100%" stop-color="#BEE1E6" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#845EC2" />
      <stop offset="100%" stop-color="#B39CD0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Soft Pastel Gradient -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" />
  <circle cx="100" cy="100" r="91" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.8" />

  <!-- Hoodie & Body -->
  <path d="M 45 195 C 45 140, 155 140, 155 195 Z" fill="url(#hoodieGrad)" />
  <path d="M 85 150 L 100 175 L 115 150 Z" fill="#FBEAFF" opacity="0.9" />

  <!-- Goose Neck & Head -->
  <path d="M 84 150 C 84 105, 82 85, 82 60 C 82 35, 118 35, 118 60 C 118 85, 116 105, 116 150 Z" fill="#FFFFFF" />

  <!-- Soft Blush -->
  <ellipse cx="85" cy="65" rx="5.5" ry="3.5" fill="#FF9EAA" opacity="0.75" />
  <ellipse cx="115" cy="65" rx="5.5" ry="3.5" fill="#FF9EAA" opacity="0.75" />

  <!-- Cute Eyes -->
  <circle cx="89" cy="57" r="3.5" fill="#2C3E50" />
  <circle cx="90.5" cy="55.5" r="1.2" fill="#FFFFFF" />
  
  <circle cx="111" cy="57" r="3.5" fill="#2C3E50" />
  <circle cx="112.5" cy="55.5" r="1.2" fill="#FFFFFF" />

  <!-- Cute Beak -->
  <path d="M 92 61 C 92 59, 108 59, 108 61 C 110 70, 90 70, 92 61 Z" fill="#FFB703" />

  <!-- Headphones -->
  <path d="M 76 48 C 76 25, 124 25, 124 48" fill="none" stroke="#00C9A7" stroke-width="5" stroke-linecap="round" />
  <rect x="71" y="44" width="8" height="15" rx="4" fill="#00C9A7" />
  <rect x="121" y="44" width="8" height="15" rx="4" fill="#00C9A7" />

  <!-- Sparkles & Stars -->
  <path d="M 148 38 L 151 45 L 158 48 L 151 51 L 148 58 L 145 51 L 138 48 L 145 45 Z" fill="#FFD166" opacity="0.9" />
  <circle cx="48" cy="68" r="3.5" fill="#B5E2FA" opacity="0.9" />
  <circle cx="156" cy="115" r="4" fill="#FFC6FF" opacity="0.9" />
</svg>
